# Evita que el proyecto gratuito de Supabase se pause por inactividad
# (se pausa tras 7 días sin peticiones, p. ej. en vacaciones).
name: keepalive
on:
  schedule:
    - cron: "17 15 * * 1,4"   # lunes y jueves
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL = "\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY = "\K[^"]+' config.js)
          # Supabase ya no deja leer la raíz /rest/v1/ con la llave anónima (da 401),
          # así que hacemos una consulta real a la base de datos. Sin sesión, las
          # reglas RLS devuelven una lista vacía, pero la petición cuenta como actividad.
          curl -fsS "$URL/rest/v1/bookings?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" && echo " ok"
